apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tramplin-email-service
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: gitlab-tramplin-email-service
    kind: SecretStore
  target:
    name: tramplin-email-service
    creationPolicy: Orphan
    deletionPolicy: Retain
  data:
  - secretKey: SMTP_USERNAME
    remoteRef:
      key: SMTP_USERNAME
  - secretKey: SMTP_PASSWORD
    remoteRef:
      key: SMTP_PASSWORD
